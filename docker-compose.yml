services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      VOICE_DATABASE_URL: sqlite:///./data/voice_password.db
      VOICE_SECRET_KEY: ${VOICE_SECRET_KEY:-local-demo-secret-change-me}
      VOICE_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "5173:80"
